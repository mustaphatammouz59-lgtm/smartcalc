<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Calculator</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="calculator">
    <h1 class="brand">Nova Calculator</h1>

    <!-- شاشة العرض: سطر للمعادلة وسطر للنتيجة -->
    <section class="display" aria-live="polite">
      <div class="expression" id="expression">&nbsp;</div>
      <div class="result" id="result">0</div>
    </section>

    <!-- لوحة الأزرار -->
    <section class="keys">
      <!-- صف التحكم -->
      <button class="key key-fn" data-key="clear">C</button>
      <button class="key key-fn" data-key="backspace">⌫</button>
      <button class="key key-fn" data-key="open">(</button>
      <button class="key key-fn" data-key="close">)</button>
      <button class="key key-op" data-key="div">÷</button>

      <!-- الصف العلمي -->
      <button class="key key-fn" data-key="sin">sin</button>
      <button class="key key-fn" data-key="cos">cos</button>
      <button class="key key-fn" data-key="tan">tan</button>
      <button class="key key-fn" data-key="sqrt">√</button>
      <button class="key key-op" data-key="mul">×</button>

      <!-- صف الأرقام 7-9 -->
      <button class="key" data-key="7">7</button>
      <button class="key" data-key="8">8</button>
      <button class="key" data-key="9">9</button>
      <button class="key key-fn" data-key="squared">x²</button>
      <button class="key key-op" data-key="sub">−</button>

      <!-- صف الأرقام 4-6 -->
      <button class="key" data-key="4">4</button>
      <button class="key" data-key="5">5</button>
      <button class="key" data-key="6">6</button>
      <button class="key key-fn" data-key="pi">π</button>
      <button class="key key-op" data-key="add">+</button>

      <!-- صف الأرقام 1-3 + زر يساوي الطويل -->
      <button class="key" data-key="1">1</button>
      <button class="key" data-key="2">2</button>
      <button class="key" data-key="3">3</button>
      <button class="key key-fn" data-key="e">e</button>
      <button class="key key-eq" data-key="equals">=</button>

      <!-- الصف الأخير: صفر عريض + النقطة -->
      <button class="key zero" data-key="0">0</button>
      <button class="key" data-key="dot">.</button>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
